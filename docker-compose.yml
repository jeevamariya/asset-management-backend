services:
  postgres:
    image: postgres:16
    container_name: asset_postgres
    environment:
      POSTGRES_DB: asset_management
      POSTGRES_USER: asset_admin
      POSTGRES_PASSWORD: asset_password
    volumes:
      - postgres_data:/var/lib/postgresql/data

  django:
    build: .
    container_name: asset_django
    command: gunicorn asset_management.wsgi:application --bind 0.0.0.0:8000
    volumes:
      - .:/app
    environment:
      POSTGRES_DB: asset_management
      POSTGRES_USER: asset_admin
      POSTGRES_PASSWORD: asset_password
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      DEBUG: "False"
    depends_on:
      - postgres
    ports:
      - "8000:8000"

  nginx:
    image: nginx:alpine
    container_name: asset_nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./staticfiles:/app/staticfiles:ro
    depends_on:
      - django

  frontend:
    build: ../asset_management_frontend
    container_name: asset_frontend
    ports:
      - "3000:80"

volumes:
  postgres_data: